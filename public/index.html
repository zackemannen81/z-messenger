<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f6f8"><title>z-messenger</title><link rel="stylesheet" href="/styles.css"></head><body>
<main class="app-shell" id="app" aria-live="polite">
  <section class="join-card" id="join-screen"><div class="brand-mark">z</div><p class="eyebrow">Z MESSENGER</p><h1>Stay close.</h1><p class="intro">A quiet place for the conversations that matter.</p><form id="join-form"><label for="username">Your name</label><input id="username" autocomplete="nickname" maxlength="24" placeholder="e.g. Alex Morgan" required><button type="submit">Enter messenger <span>?</span></button></form><p class="join-hint">Available to everyone on this local network.</p></section>
  <section class="messenger" id="messenger" hidden>
    <aside class="sidebar"><header><div class="avatar" id="self-avatar"></div><div><strong id="self-name"></strong><span><i></i> Available</span></div></header><button class="contact selected" data-recipient="ALL"><b class="all-icon">#</b><span>Everyone<small id="online-count">0 online</small></span></button><p class="section-label">ONLINE NOW</p><div id="contacts" class="contacts"></div><footer><button id="leave" aria-label="Leave messenger">Sign out</button></footer></aside>
    <section class="chat"><header class="chat-header"><div><p id="chat-kicker">GROUP CONVERSATION</p><h2 id="chat-title">Everyone</h2></div><button id="nudge" title="Send a nudge" aria-label="Send a nudge">?</button></header><div id="messages" class="messages" aria-label="Messages"></div><form id="composer" class="composer"><label class="sr-only" for="message">Message</label><input id="message" maxlength="2000" placeholder="Message everyone…" autocomplete="off"><button type="submit" aria-label="Send message">?</button></form></section>
  </section>
</main><div id="toast" role="alert"></div><script type="module" src="/app.js"></script></body></html>
